name: Hawk Debian Package (Wine compatibility)

on:
  workflow_run:
    workflows: ["Hawk Windows CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Hawk Windows CI run ID whose hawk-os-windows artifact should be packaged"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hawk-linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: hawk-os-windows
          path: package-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}

      - name: Verify input executable
        run: |
          set -euxo pipefail
          test -s package-input/hawk.exe
          file package-input/hawk.exe
          file package-input/hawk.exe | grep -qi 'PE32+'

      - name: Package .deb wrapper requiring Wine
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euxo pipefail
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          ROOT="$PWD/dist/pkg-root"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/hawk-os" "$ROOT/usr/bin" "$ROOT/usr/share/applications"
          install -m 0755 package-input/hawk.exe "$ROOT/opt/hawk-os/hawk.exe"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: hawk-os-wine
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: wine, xdg-utils
          Maintainer: Hawk OS contributors
          Description: Hawk OS desktop agent (Windows build via Wine)
           Packages the tested Win32 Hawk executable with a Wine launcher.
           This is a compatibility wrapper, not a native Linux port.
          EOF
          cat > "$ROOT/usr/bin/hawk-os" <<'EOF'
          #!/bin/sh
          set -eu
          APP_DIR=/opt/hawk-os
          if ! command -v wine >/dev/null 2>&1; then
            echo "Hawk OS needs Wine. Install the package dependency and retry." >&2
            exit 127
          fi
          cd "$APP_DIR"
          exec wine "$APP_DIR/hawk.exe" "$@"
          EOF
          chmod 0755 "$ROOT/usr/bin/hawk-os"
          cat > "$ROOT/usr/share/applications/hawk-os.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Hawk OS
          Comment=Desktop task agent (Windows build through Wine)
          Exec=hawk-os
          Terminal=false
          Categories=Utility;
          EOF
          dpkg-deb --root-owner-group --build "$ROOT" "dist/hawk-os-wine_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/hawk-os-wine_${VERSION}_amd64.deb"
          dpkg-deb --contents "dist/hawk-os-wine_${VERSION}_amd64.deb"
          printf '%s\n' "$SOURCE_RUN_ID" > dist/source-windows-run.txt
          rm -rf "$ROOT"

      - name: Publish package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawk-os-debian-package
          path: |
            dist/hawk-os-wine_*_amd64.deb
            dist/source-windows-run.txt
          if-no-files-found: error
          retention-days: 14
