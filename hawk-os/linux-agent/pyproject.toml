[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-os-linux"
version = "0.1.0"
description = "Linux-native sandbox inspection agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["huggingface_hub>=0.30", "torch>=2.6", "transformers>=4.57", "accelerate>=1.2"]

[project.scripts]
hawk-linux = "hawk_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
